<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plot-Armor | VeriApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Map CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Space Grotesk', sans-serif; background-color: #000; } 
        /* Mobile Simulator Constraints */
        .mobile-simulator { max-width: 414px; height: 100vh; margin: 0 auto; background: #071019; position: relative; border-left: 1px solid #333; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #map { flex-grow: 1; width: 100%; z-index: 10; }
        .bottom-sheet { background: #0c1624; border-top: 1px solid #1f2937; padding: 20px; z-index: 20; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-gray-100">

    <div class="mobile-simulator shadow-2xl">
        <!-- Top App Bar -->
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center z-20 shadow-md">
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                    <span class="text-blue-400">🛡️ VeriApp</span>
                </h1>
                <p class="text-xs text-green-400 font-mono mt-1">● ON-GRID | TEE SECURE</p>
            </div>
            <div class="text-right text-xs text-gray-400 font-mono">
                Lat: 16.500<br>Lon: 80.600
            </div>
        </div>

        <!-- GIS Map Canvas (Survey Area) -->
        <div id="map"></div>

        <!-- Bottom Actions Sheet -->
        <div class="bottom-sheet flex flex-col gap-3">
            <div class="mb-2">
                <span class="bg-gray-700 text-gray-300 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Assigned Task</span>
                <p class="text-sm font-bold mt-1 text-white">Target: ULPIN_99887766</p>
                <p class="text-xs text-gray-400">Trace the F-line boundary on the ground to capture GNSS vertices.</p>
            </div>

            <!-- 1. TEE Signature -->
            <button id="bioBtn" onclick="triggerHardwareHook()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm transition-colors w-full flex justify-center items-center gap-2 border border-blue-400/30">
                <span>👁️ Initialize Hardware Biometric</span>
            </button>

            <!-- 2. Transmit to Trust Pipeline -->
            <button id="submitBtn" onclick="transmitEvidence()" disabled class="bg-gray-700 text-gray-400 font-bold py-3 rounded-lg text-sm w-full flex justify-center items-center gap-2 transition-all cursor-not-allowed">
                <span>⛓️ Sign & Transmit to Pipeline</span>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <script>
        // State variables
        let isHardwareSigned = false;
        let collectedGeometry = null;
        const TARGET_ULPIN = "ULPIN_99887766";
        const API_URL = "http://localhost:8080/api/v1/pipeline/compare/execute";

        // Legacy Boundary (What is currently in the government system)
        const legacyGeoJSON = {
            "type": "Polygon",
            "coordinates": [[[80.600, 16.500], [80.602, 16.500], [80.602, 16.502], [80.600, 16.502], [80.600, 16.500]]]
        };

        // Initialize Leaflet Map (Hidden attribution for cleaner mobile view)
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([16.501, 80.601], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 }).addTo(map);

        // Display the Legacy Plot in RED (dashed to indicate uncertainty)
        L.geoJSON(legacyGeoJSON, { 
            style: { color: '#ef4444', weight: 2, dashArray: '5, 5', fillOpacity: 0.1 } 
        }).addTo(map);

        // Drawing Controls setup
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);
        map.addControl(new L.Control.Draw({ 
            position: 'topright',
            draw: { polyline: false, circle: false, marker: false, circlemarker: false, polygon: { shapeOptions: { color: '#3b82f6', weight: 3 } }, rectangle: true }, 
            edit: { featureGroup: drawnItems, remove: true } 
        }));

        // Event listener for surveyor completing drawing
        map.on('draw:created', function (e) {
            drawnItems.clearLayers();
            drawnItems.addLayer(e.layer);
            collectedGeometry = e.layer.toGeoJSON().geometry; // Grab raw GeoJSON
            checkUnlock();
        });

        // Simulate Secure Enclave execution
        function triggerHardwareHook() {
            const btn = document.getElementById('bioBtn');
            btn.innerHTML = "Secure Enclave Authenticating...";
            btn.classList.replace('bg-blue-600', 'bg-gray-600');
            
            setTimeout(() => {
                isHardwareSigned = true;
                btn.innerHTML = "✅ Identity Locked: OFFCR_8192";
                btn.classList.replace('bg-gray-600', 'bg-green-600/20');
                btn.classList.replace('text-white', 'text-green-400');
                btn.classList.replace('border-blue-400/30', 'border-green-500/30');
                btn.classList.remove('hover:bg-blue-500');
                btn.onclick = null; // Lock button
                checkUnlock();
            }, 700);
        }

        // Logic check before submission
        function checkUnlock() {
            if(isHardwareSigned && collectedGeometry) {
                const sBtn = document.getElementById('submitBtn');
                sBtn.disabled = false;
                sBtn.classList.replace('bg-gray-700', 'bg-green-600');
                sBtn.classList.replace('text-gray-400', 'text-white');
                sBtn.classList.replace('cursor-not-allowed', 'hover:bg-green-500');
                sBtn.innerHTML = "⛓️ Transmit Cryptographic Package";
            }
        }

        // Send to Trust Pipeline API Gateway
        async function transmitEvidence() {
            if (!isHardwareSigned || !collectedGeometry) return;
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "Transmitting... 📡";
            btn.disabled = true;

            const payload = {
                parcel_id: TARGET_ULPIN,
                surveyorId: "OFFCR_8192",
                legacyPolygon: legacyGeoJSON,
                surveyPolygon: collectedGeometry
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert(`Evidence Synced Successfully!\n\nSystem Classification: [${data.state}]\nSDI Risk: ${data.metrics.risk_score}%\n\nMoving to Phase 5: Tahsildar Review queue.`);
                    window.location.reload(); // Reset UI for next parcel
                } else {
                    alert(`Pipeline Error: ${data.error}`);
                    btn.innerHTML = "⛓️ Try Transmitting Again";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Network offline: Data cached locally for next connection event."); // Proves Offline-First methodology
                console.error(err);
                btn.innerHTML = "⛓️ Try Transmitting Again";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
